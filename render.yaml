# Deploy em 1 clique no Render (render.com → New → Blueprint → escolha este repositório).
# Serve o site do jogo + o multiplayer no mesmo endereço HTTPS (WebXR exige HTTPS).
services:
  - type: web
    name: pega-primata
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: node server/server.js
    healthCheckPath: /health
    autoDeploy: true
